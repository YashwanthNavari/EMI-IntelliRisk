project:
  name: "EMIPredict AI"
  version: "1.0.0"
  description: "Intelligent Financial Risk Assessment & EMI Affordability Platform"
  author: "FinTech & ML Engineering Team"
  random_seed: 42

paths:
  raw_data: "data/raw/emi_prediction_dataset.csv"
  root_dataset: "emi_prediction_dataset.csv"
  interim_data: "data/interim/cleaned_dataset.parquet"
  interim_csv: "data/interim/cleaned_dataset_sample.csv"
  processed_features: "data/processed/featured_dataset.parquet"
  train_data: "data/processed/train_data.parquet"
  val_data: "data/processed/val_data.parquet"
  test_data: "data/processed/test_data.parquet"
  classification_models_dir: "models/classification"
  regression_models_dir: "models/regression"
  reports_dir: "reports"
  database_path: "database/emipredict.db"
  mlflow_tracking_uri: "file:./mlruns"
  mlflow_registry_export: "models/mlflow_summary.json"

dataset:
  raw_file: "emi_prediction_dataset.csv"
  target_classification: "emi_eligibility"
  target_regression: "max_monthly_emi"
  id_column: "customer_id"
  test_size: 0.15
  val_size: 0.15
  stratify_split: true

columns:
  numeric_features:
    - "age"
    - "monthly_salary"
    - "years_of_employment"
    - "monthly_rent"
    - "family_size"
    - "dependents"
    - "school_fees"
    - "college_fees"
    - "travel_expenses"
    - "groceries_utilities"
    - "other_monthly_expenses"
    - "current_emi_amount"
    - "credit_score"
    - "bank_balance"
    - "emergency_fund"
    - "requested_amount"
    - "requested_tenure"

  categorical_features:
    - "gender"
    - "marital_status"
    - "education"
    - "employment_type"
    - "company_type"
    - "house_type"
    - "existing_loans"
    - "emi_scenario"

  engineered_features:
    - "total_expenses"
    - "disposable_income"
    - "expense_to_income_ratio"
    - "foir"
    - "emi_burden_ratio"
    - "savings_to_income_ratio"
    - "emergency_fund_buffer_months"
    - "loan_to_income_ratio"
    - "requested_monthly_installment_estimate"
    - "per_capita_disposable_income"
    - "credit_risk_tier"
    - "financial_health_score"

targets:
  classification:
    name: "emi_eligibility"
    classes:
      - "Not_Eligible"
      - "Eligible"
      - "High_Risk"
    positive_classes:
      - "Eligible"
    risk_class: "High_Risk"

  regression:
    name: "max_monthly_emi"
    min_value: 500.0
    max_value: 100000.0

model_training:
  cv_folds: 5
  n_jobs: -1
  classification_models:
    logistic_regression:
      C: 1.0
      max_iter: 1000
      class_weight: "balanced"
      solver: "lbfgs"
    random_forest:
      n_estimators: 120
      max_depth: 14
      min_samples_split: 5
      min_samples_leaf: 2
      class_weight: "balanced_subsample"
      n_jobs: -1
    gradient_boosting:
      n_estimators: 150
      learning_rate: 0.08
      max_depth: 6
      subsample: 0.85
      colsample_bytree: 0.85

  regression_models:
    ridge_regression:
      alpha: 10.0
    random_forest:
      n_estimators: 120
      max_depth: 16
      min_samples_split: 5
      min_samples_leaf: 2
      n_jobs: -1
    gradient_boosting:
      n_estimators: 150
      learning_rate: 0.08
      max_depth: 6
      subsample: 0.85
      colsample_bytree: 0.85

database:
  db_name: "database/emipredict.db"
  pool_size: 5
  echo: false

app:
  title: "EMIPredict AI"
  layout: "wide"
  theme: "dark"
  currency_symbol: "₹"
