[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emi-intellirisk"
version = "1.0.0"
description = "EMI-IntelliRisk — An Intelligent FinTech Machine Learning Platform for Credit Risk Assessment & EMI Affordability"
authors = [{ name = "Yashwanth Navari", email = "ekomotsu@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "streamlit",
    "plotly",
    "pydantic",
    "pyyaml",
    "joblib"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
