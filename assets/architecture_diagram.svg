<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D1A" />
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="emeraldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes dashFlow { to { stroke-dashoffset: -40; } }
      .flow-line { stroke-dasharray: 6, 6; animation: dashFlow 2s linear infinite; }
      .stage-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 1px; }
      .box-title { font-family: 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #F8FAFC; }
      .box-desc { font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: 400; fill: #94A3B8; line-height: 1.4; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1100" height="560" rx="16" fill="#060913" stroke="#1E293B" stroke-width="1.5" />

  <!-- Top Banner -->
  <rect x="0" y="0" width="1100" height="60" rx="16" fill="#0B132B" />
  <text x="40" y="38" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#00F2FE" letter-spacing="1">
    SYSTEM ARCHITECTURE &amp; END-TO-END DATA FLOW
  </text>
  <text x="1060" y="38" text-anchor="end" font-family="'Segoe UI', monospace" font-size="12" fill="#64748B">
    ZERO-LEAKAGE • DUAL-PIPELINE • PRODUCTION-READY
  </text>

  <!-- STAGE 1: INGESTION -->
  <g transform="translate(40, 90)">
    <rect width="190" height="420" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="190" height="36" rx="12" fill="#0F172A" />
    <text x="95" y="24" text-anchor="middle" class="stage-title" fill="#38BDF8">1. INGESTION &amp; EDA</text>

    <!-- Sub-boxes -->
    <g transform="translate(15, 55)">
      <rect width="160" height="85" rx="8" fill="#131D33" stroke="rgba(56, 189, 248, 0.2)" />
      <text x="12" y="26" class="box-title" font-size="13">Raw Corpus</text>
      <text x="12" y="46" class="box-desc">404,800 records</text>
      <text x="12" y="62" class="box-desc">27 raw features</text>
      <text x="12" y="78" class="box-desc">Financial disclosures</text>
    </g>

    <g transform="translate(15, 155)">
      <rect width="160" height="85" rx="8" fill="#131D33" stroke="rgba(56, 189, 248, 0.2)" />
      <text x="12" y="26" class="box-title" font-size="13">Data Sanitation</text>
      <text x="12" y="46" class="box-desc">Regex currency clean</text>
      <text x="12" y="62" class="box-desc">Range bounded caps</text>
      <text x="12" y="78" class="box-desc">Categorical norm</text>
    </g>

    <g transform="translate(15, 255)">
      <rect width="160" height="85" rx="8" fill="#131D33" stroke="rgba(56, 189, 248, 0.2)" />
      <text x="12" y="26" class="box-title" font-size="13">Holdout Sanctity</text>
      <text x="12" y="46" class="box-desc">70% Train (283.4K)</text>
      <text x="12" y="62" class="box-desc">15% Val (60.7K)</text>
      <text x="12" y="78" class="box-desc">15% Test (60.7K)</text>
    </g>

    <g transform="translate(15, 355)">
      <rect width="160" height="45" rx="8" fill="rgba(56, 189, 248, 0.08)" stroke="#38BDF8" />
      <text x="80" y="28" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38BDF8">✓ Zero Leakage</text>
    </g>
  </g>

  <!-- Flow 1 to 2 -->
  <line x1="230" y1="300" x2="270" y2="300" stroke="#00F2FE" stroke-width="2" class="flow-line" />

  <!-- STAGE 2: FEATURE ENGINEERING -->
  <g transform="translate(270, 90)">
    <rect width="210" height="420" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="210" height="36" rx="12" fill="#0F172A" />
    <text x="105" y="24" text-anchor="middle" class="stage-title" fill="#10B981">2. FINTECH FEATURES</text>

    <!-- Sub-boxes -->
    <g transform="translate(15, 55)">
      <rect width="180" height="75" rx="8" fill="#131D33" stroke="rgba(16, 185, 129, 0.2)" />
      <text x="12" y="24" class="box-title" font-size="13">Solvency Ratios</text>
      <text x="12" y="44" class="box-desc">FOIR: Total Debt / Income</text>
      <text x="12" y="62" class="box-desc">ETI: Expenses / Salary</text>
    </g>

    <g transform="translate(15, 145)">
      <rect width="180" height="75" rx="8" fill="#131D33" stroke="rgba(16, 185, 129, 0.2)" />
      <text x="12" y="24" class="box-title" font-size="13">Liquidity &amp; Runway</text>
      <text x="12" y="44" class="box-desc">Emergency Runway Buffer</text>
      <text x="12" y="62" class="box-desc">Bank Balance to EMI</text>
    </g>

    <g transform="translate(15, 235)">
      <rect width="180" height="75" rx="8" fill="#131D33" stroke="rgba(16, 185, 129, 0.2)" />
      <text x="12" y="24" class="box-title" font-size="13">Cash Surplus Math</text>
      <text x="12" y="44" class="box-desc">True Disposable Surplus</text>
      <text x="12" y="62" class="box-desc">Discretionary Net Flow</text>
    </g>

    <g transform="translate(15, 325)">
      <rect width="180" height="75" rx="8" fill="#131D33" stroke="rgba(16, 185, 129, 0.2)" />
      <text x="12" y="24" class="box-title" font-size="13">Family Burden Index</text>
      <text x="12" y="44" class="box-desc">Per-Capita Dependency</text>
      <text x="12" y="62" class="box-desc">School &amp; College Load</text>
    </g>
  </g>

  <!-- Flow 2 to 3 -->
  <line x1="480" y1="210" x2="520" y2="180" stroke="#10B981" stroke-width="2" class="flow-line" />
  <line x1="480" y1="390" x2="520" y2="400" stroke="#10B981" stroke-width="2" class="flow-line" />

  <!-- STAGE 3: DUAL ML ENGINE -->
  <g transform="translate(520, 90)">
    <rect width="250" height="420" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="250" height="36" rx="12" fill="#0F172A" />
    <text x="125" y="24" text-anchor="middle" class="stage-title" fill="#818CF8">3. DUAL-TASK ML ENGINE</text>

    <!-- Branch A: Classification -->
    <g transform="translate(15, 55)">
      <rect width="220" height="155" rx="8" fill="#131D33" stroke="rgba(129, 140, 248, 0.3)" />
      <text x="12" y="24" class="box-title" fill="#A78BFA">A. Underwriting Classifier</text>
      <text x="12" y="44" class="box-desc">Target: 3 Classes (Eligible, High-Risk, Not-Eligible)</text>
      <text x="12" y="62" class="box-desc">Champion: Gradient Boosting (LGBM)</text>
      <text x="12" y="80" class="box-desc" font-weight="700" fill="#38BDF8">Balanced Class Weights: 1:4.4:0.43</text>
      <rect x="12" y="95" width="196" height="48" rx="6" fill="#0A0F1D" />
      <text x="20" y="114" font-family="'Segoe UI', monospace" font-size="11" fill="#10B981">Macro-F1: 0.8725 | Acc: 95.87%</text>
      <text x="20" y="132" font-family="'Segoe UI', monospace" font-size="11" fill="#F59E0B">High-Risk Recall: 93.63%</text>
    </g>

    <!-- Branch B: Regression -->
    <g transform="translate(15, 230)">
      <rect width="220" height="155" rx="8" fill="#131D33" stroke="rgba(129, 140, 248, 0.3)" />
      <text x="12" y="24" class="box-title" fill="#38BDF8">B. Sustainable EMI Regressor</text>
      <text x="12" y="44" class="box-desc">Target: max_monthly_emi (₹500 - ₹91K)</text>
      <text x="12" y="62" class="box-desc">Champion: Gradient Boosting (Huber)</text>
      <text x="12" y="80" class="box-desc" font-weight="700" fill="#10B981">Robust to High-Income Leverage</text>
      <rect x="12" y="95" width="196" height="48" rx="6" fill="#0A0F1D" />
      <text x="20" y="114" font-family="'Segoe UI', monospace" font-size="11" fill="#38BDF8">R²: 0.9905 | SMAPE: 5.40%</text>
      <text x="20" y="132" font-family="'Segoe UI', monospace" font-size="11" fill="#A78BFA">MAE: ₹261.89 | RMSE: ₹762.69</text>
    </g>
  </g>

  <!-- Flow 3 to 4 -->
  <line x1="770" y1="300" x2="810" y2="300" stroke="#818CF8" stroke-width="2" class="flow-line" />

  <!-- STAGE 4: PRODUCTION & INTERFACE -->
  <g transform="translate(810, 90)">
    <rect width="250" height="420" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="250" height="36" rx="12" fill="#0F172A" />
    <text x="125" y="24" text-anchor="middle" class="stage-title" fill="#F59E0B">4. SERVING &amp; XAI</text>

    <!-- Sub-boxes -->
    <g transform="translate(15, 55)">
      <rect width="220" height="95" rx="8" fill="#131D33" stroke="rgba(245, 158, 11, 0.2)" />
      <text x="12" y="24" class="box-title" font-size="13">Explainable AI (TreeSHAP)</text>
      <text x="12" y="44" class="box-desc">Global Feature Importance</text>
      <text x="12" y="62" class="box-desc">Local Factor Decomposition</text>
      <text x="12" y="80" class="box-desc">Counterfactual Simulation</text>
    </g>

    <g transform="translate(15, 165)">
      <rect width="220" height="95" rx="8" fill="#131D33" stroke="rgba(245, 158, 11, 0.2)" />
      <text x="12" y="24" class="box-title" font-size="13">Streamlit Executive Suite</text>
      <text x="12" y="44" class="box-desc">8-Page FinTech Application</text>
      <text x="12" y="62" class="box-desc">Real-time Risk Calculator</text>
      <text x="12" y="80" class="box-desc">Macroeconomic Stress-Testing</text>
    </g>

    <g transform="translate(15, 275)">
      <rect width="220" height="115" rx="8" fill="#131D33" stroke="rgba(245, 158, 11, 0.2)" />
      <text x="12" y="24" class="box-title" font-size="13">Enterprise MLOps &amp; DB</text>
      <text x="12" y="44" class="box-desc">SQLite Database Audit Trails</text>
      <text x="12" y="62" class="box-desc">MLflow Experiment Registry</text>
      <text x="12" y="80" class="box-desc">Full Customer Profile CRUD</text>
      <text x="12" y="98" class="box-desc">CSV Audit Trail Export</text>
    </g>
  </g>
</svg>
